<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1d2e"/>
      <stop offset="100%" style="stop-color:#282838"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6364ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6364ff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent glow top-right -->
  <ellipse cx="1050" cy="120" rx="340" ry="260" fill="url(#accentGlow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#6364ff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Calendar icon (right side) -->
  <g transform="translate(820, 130)">
    <!-- Calendar body -->
    <rect x="0" y="40" width="280" height="260" rx="16" fill="#6364ff" fill-opacity="0.12" stroke="#6364ff" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Calendar header -->
    <rect x="0" y="40" width="280" height="56" rx="16" fill="#6364ff" fill-opacity="0.25"/>
    <rect x="0" y="72" width="280" height="24" fill="#6364ff" fill-opacity="0.25"/>
    <!-- Header pins -->
    <rect x="72" y="24" width="12" height="32" rx="6" fill="#6364ff" fill-opacity="0.6"/>
    <rect x="196" y="24" width="12" height="32" rx="6" fill="#6364ff" fill-opacity="0.6"/>
    <!-- Month label -->
    <text x="140" y="76" font-family="sans-serif" font-size="16" font-weight="600" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">May 2026</text>
    <!-- Day grid -->
    <g font-family="sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">
      <text x="30" y="128">Mo</text><text x="70" y="128">Tu</text><text x="110" y="128">We</text><text x="150" y="128">Th</text><text x="190" y="128">Fr</text><text x="230" y="128">Sa</text><text x="270" y="128">Su</text>
    </g>
    <g font-family="sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">
      <!-- Week 1 -->
      <text x="150" y="164">1</text><text x="190" y="164">2</text><text x="230" y="164">3</text><text x="270" y="164">4</text>
      <!-- Week 2 -->
      <text x="30" y="198">5</text><text x="70" y="198">6</text>
      <!-- Highlighted day -->
      <circle cx="110" cy="189" r="16" fill="#6364ff" fill-opacity="0.9"/>
      <text x="110" y="198" fill="#ffffff" fill-opacity="1" font-weight="700">7</text>
      <text x="150" y="198">8</text><text x="190" y="198">9</text><text x="230" y="198">10</text><text x="270" y="198">11</text>
      <!-- Week 3 -->
      <text x="30" y="232">12</text><text x="70" y="232">13</text><text x="110" y="232">14</text><text x="150" y="232">15</text><text x="190" y="232">16</text><text x="230" y="232">17</text><text x="270" y="232">18</text>
      <!-- Week 4 -->
      <text x="30" y="266">19</text><text x="70" y="266">20</text><text x="110" y="266">21</text><text x="150" y="266">22</text><text x="190" y="266">23</text><text x="230" y="266">24</text><text x="270" y="266">25</text>
    </g>
    <!-- Event pill -->
    <rect x="24" y="278" width="148" height="22" rx="11" fill="#6364ff" fill-opacity="0.7"/>
    <text x="98" y="293" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Community meetup</text>
  </g>

  <!-- Left content -->
  <!-- Kronk wordmark pill -->
  <rect x="72" y="100" width="110" height="30" rx="15" fill="#6364ff" fill-opacity="0.2" stroke="#6364ff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="127" y="120" font-family="sans-serif" font-size="13" font-weight="600" fill="#6364ff" fill-opacity="0.9" text-anchor="middle">₭ronk</text>

  <!-- Main title -->
  <text x="72" y="230" font-family="sans-serif" font-size="88" font-weight="700" fill="#ffffff" letter-spacing="-2">₭alendar</text>

  <!-- Accent underline -->
  <rect x="72" y="248" width="380" height="4" rx="2" fill="#6364ff" fill-opacity="0.7"/>

  <!-- Subtitle -->
  <text x="72" y="310" font-family="sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.55" letter-spacing="0.2">Events, gatherings &amp; moments</text>
  <text x="72" y="342" font-family="sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.55" letter-spacing="0.2">across the Kronk community.</text>

  <!-- CTA area -->
  <rect x="72" y="395" width="200" height="48" rx="24" fill="#6364ff" fill-opacity="0.9"/>
  <text x="172" y="424" font-family="sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Open ₭alendar</text>

  <!-- Bottom domain -->
  <text x="72" y="570" font-family="sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.3">mastodon.kronk.info/kalendar</text>
</svg>

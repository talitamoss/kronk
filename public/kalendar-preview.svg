<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1927"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#6364ff"/>

  <!-- Subtle grid -->
  <g stroke="#6364ff" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Right: calendar card -->
  <g transform="translate(740, 80)">
    <rect x="0" y="0" width="380" height="440" rx="20" fill="#252336" stroke="#6364ff" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="70" rx="20" fill="#6364ff" fill-opacity="0.85"/>
    <rect x="0" y="50" width="380" height="20" fill="#6364ff" fill-opacity="0.85"/>
    <rect x="100" y="-14" width="14" height="28" rx="7" fill="#6364ff"/>
    <rect x="266" y="-14" width="14" height="28" rx="7" fill="#6364ff"/>
    <text x="190" y="42" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">May 2026</text>
    <g font-family="DejaVu Sans,sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">
      <text x="34" y="106">Mo</text><text x="88" y="106">Tu</text><text x="142" y="106">We</text>
      <text x="196" y="106">Th</text><text x="250" y="106">Fr</text><text x="304" y="106">Sa</text><text x="358" y="106">Su</text>
    </g>
    <g font-family="DejaVu Sans,sans-serif" font-size="16" fill="#ffffff" fill-opacity="0.75" text-anchor="middle">
      <text x="196" y="148">1</text><text x="250" y="148">2</text><text x="304" y="148">3</text><text x="358" y="148">4</text>
      <text x="34" y="192">5</text><text x="88" y="192">6</text>
      <circle cx="142" cy="183" r="20" fill="#6364ff"/>
      <text x="142" y="192" fill="#ffffff" fill-opacity="1" font-weight="700">7</text>
      <text x="196" y="192">8</text><text x="250" y="192">9</text><text x="304" y="192">10</text><text x="358" y="192">11</text>
      <text x="34" y="236">12</text><text x="88" y="236">13</text><text x="142" y="236">14</text><text x="196" y="236">15</text>
      <text x="250" y="236">16</text><text x="304" y="236">17</text><text x="358" y="236">18</text>
      <text x="34" y="280">19</text><text x="88" y="280">20</text><text x="142" y="280">21</text><text x="196" y="280">22</text>
      <text x="250" y="280">23</text><text x="304" y="280">24</text><text x="358" y="280">25</text>
    </g>
    <rect x="20" y="310" width="200" height="28" rx="14" fill="#6364ff" fill-opacity="0.7"/>
    <text x="120" y="329" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Community meetup</text>
    <rect x="20" y="350" width="160" height="28" rx="14" fill="#6364ff" fill-opacity="0.35"/>
    <text x="100" y="369" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">Art show opening</text>
  </g>

  <!-- Left: text content -->
  <rect x="72" y="110" width="100" height="28" rx="14" fill="#6364ff" fill-opacity="0.2" stroke="#6364ff" stroke-opacity="0.5" stroke-width="1"/>
  <text x="122" y="129" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="600" fill="#6364ff" text-anchor="middle">Kronk</text>

  <!-- ₭ drawn as SVG paths at ~82px bold, baseline y=232, x-start=72 -->
  <!-- cap height y=158, junction y=202, baseline y=232, width ~60px -->
  <!-- Vertical stem -->
  <rect x="72" y="158" width="13" height="74" rx="1" fill="#ffffff"/>
  <!-- Upper arm: from junction to top-right -->
  <polygon points="85,204 85,186 132,158 132,170" fill="#ffffff"/>
  <!-- Lower arm: from junction to bottom-right -->
  <polygon points="85,204 132,232 120,232 85,218" fill="#ffffff"/>
  <!-- Crossbar (makes K into ₭): horizontal bar through upper stem -->
  <rect x="72" y="178" width="48" height="9" rx="1" fill="#ffffff"/>

  <!-- "alendar" text after the ₭ glyph -->
  <text x="140" y="232" font-family="DejaVu Sans,sans-serif" font-size="82" font-weight="700" fill="#ffffff">alendar</text>

  <!-- Purple underline -->
  <rect x="72" y="248" width="440" height="5" rx="2.5" fill="#6364ff"/>

  <!-- Subtitle -->
  <text x="72" y="304" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#9898c8">Events, gatherings &amp; moments</text>
  <text x="72" y="336" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#9898c8">across the Kronk community.</text>

  <!-- Button -->
  <rect x="72" y="384" width="220" height="52" rx="26" fill="#6364ff"/>
  <text x="182" y="416" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Open Kalendar</text>

  <!-- Domain -->
  <text x="72" y="572" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.25">mastodon.kronk.info/kalendar</text>
</svg>
